# Tests every push and pull request. The Rust side needs nothing beyond the
# toolchain (rusqlite is `bundled`), but the dashboard SPA does: `dist/` is
# gitignored and rust-embed reads it at compile time, so without a frontend
# build the embedded dashboard is empty and tests/dashboard.rs sees 404s where
# it expects the real page.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/deploy-server/dashboard/package-lock.json

      # Must run before cargo: build.rs declares rerun-if-changed on dist/, so
      # the embed picks this up, but only if the bundle is already on disk.
      - name: Build the dashboard
        working-directory: crates/deploy-server/dashboard
        run: |
          npm ci
          npm run build

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Advisory only. There are ~17 pre-existing warnings across 7 lints
      # (needless_return, derivable_impls, match_like_matches_macro and friends)
      # — all style, none of them bugs. Clear them, then drop the
      # continue-on-error and add `-- -D warnings` to make this a real gate.
      - run: cargo clippy --workspace --all-targets
        continue-on-error: true

      - run: cargo test --workspace
