# Publishes the Linux binaries that everything else consumes.
#
#   deploy-linux-x86_64         the CLI, downloaded by every repo's deploy job
#   deploy-server-linux-x86_64  the daemon, shipped to the hosts by rollout.yml
#
# Triggered by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
#
# Built on ubuntu-24.04 because that is what the droplets run: its glibc is
# 2.39, the version auth-center's build-release.sh pins for the same reason.
# Building on a newer runner image would link against a newer glibc and the
# binary would not start on the servers.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p deploy-cli -p deploy-server

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/deploy        dist/deploy-linux-x86_64
          cp target/release/deploy-server dist/deploy-server-linux-x86_64
          chmod +x dist/*
          # Consumers verify what they downloaded against this file.
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          file dist/deploy-linux-x86_64

      - name: Check the CLI runs and reports the tagged version
        run: |
          got=$(./dist/deploy-linux-x86_64 --version | awk '{print $2}')
          want="${{ github.event.inputs.tag || github.ref_name }}"
          want="${want#v}"
          echo "binary reports '$got', tag says '$want'"
          if [ "$got" != "$want" ]; then
            echo "::error::version mismatch: the tag is $want but the binary reports $got." \
                 "Bump the workspace Cargo.toml version to match the tag."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            || gh release upload "$tag" dist/* --repo "${{ github.repository }}" --clobber
